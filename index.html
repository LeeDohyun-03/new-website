<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Jisoo 💛</title>
    <!-- 감성 영문/한글 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Gowun+Dodum&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fdfaf6;
        }

        /* iOS 세로 화면 최적화 컨테이너 & 따뜻한 파스텔 그라데이션 */
        .phone-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            margin: 0 auto;
            background: linear-gradient(160deg, #fffdf9 0%, #fff3e6 45%, #fde8e8 100%);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.08);
        }

        /* 여백을 채우는 은은한 파스텔 빛망울 */
        .pastel-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(45px);
            opacity: 0.65;
            z-index: 1;
        }
        .blob-1 { width: 220px; height: 220px; background: #fff0b8; top: -40px; left: -50px; }
        .blob-2 { width: 260px; height: 260px; background: #ffd6e0; bottom: -60px; right: -50px; }

        /* 여백을 꾸며주는 4장의 폴라로이드 사진 스타일 (바닐라위켄드 썸네일 무드) */
        .deco-photo {
            position: absolute;
            background: #ffffff;
            padding: 6px 6px 18px 6px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(180, 140, 120, 0.15);
            z-index: 2;
            transition: all 0.6s ease;
        }
        .deco-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }
        /* 각 모서리 여백에 사진 배치 */
        .photo-tl { width: 105px; height: 125px; top: 5%; left: 6%; transform: rotate(-8deg); }
        .photo-tr { width: 100px; height: 120px; top: 6%; right: 6%; transform: rotate(7deg); }
        .photo-bl { width: 105px; height: 130px; bottom: 6%; left: 7%; transform: rotate(6deg); }
        .photo-br { width: 110px; height: 125px; bottom: 5%; right: 6%; transform: rotate(-6deg); }

        /* 페이지 공통 레이아웃 */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* 첫 번째 페이지: 첫 번째 이미지 구도를 모던하게 재해석한 터치 버튼 */
        .hbd-button {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 36px;
            padding: 38px 34px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(235, 160, 150, 0.22);
            animation: pulseTouch 2s infinite ease-in-out;
            user-select: none;
        }

        /* 첫 번째 참고 이미지의 HAPPY / Birthday / JISOO 구도 반영 */
        .hbd-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 5px;
            color: #8c7365;
            margin-bottom: 2px;
        }

        .hbd-mid {
            font-family: 'Dancing Script', cursive;
            font-size: 3.4rem;
            color: #e57c73;
            line-height: 1.1;
            margin: 4px 0 10px 0;
            text-shadow: 2px 3px 0px #fff5eb;
        }

        .hbd-bottom-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .whisker {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .whisker span {
            display: block;
            width: 10px;
            height: 2px;
            background-color: #f3a683;
            border-radius: 2px;
        }
        .whisker.left span:nth-child(1) { transform: rotate(20deg); }
        .whisker.left span:nth-child(3) { transform: rotate(-20deg); }
        .whisker.right span:nth-child(1) { transform: rotate(-20deg); }
        .whisker.right span:nth-child(3) { transform: rotate(20deg); }

        .hbd-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #594a42;
        }

        .double-line {
            width: 80%;
            height: 4px;
            margin: 0 auto 14px auto;
            border-top: 1.5px solid #f5cd79;
            border-bottom: 1.5px solid #f5cd79;
        }

        .tap-hint {
            font-size: 0.85rem;
            color: #a68b7c;
            letter-spacing: 0.5px;
        }

        /* 커졌다 작아졌다 하는 애니메이션 */
        @keyframes pulseTouch {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 15px 35px rgba(235, 160, 150, 0.22);
            }
            50% {
                transform: scale(1.07);
                box-shadow: 0 20px 45px rgba(235, 160, 150, 0.38);
            }
        }

        /* 두 번째 페이지: 초대장 본문 카드 */
        .invitation-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid #ffffff;
            border-radius: 28px;
            padding: 36px 24px 28px 24px;
            width: 92%;
            max-width: 350px;
            box-shadow: 0 15px 35px rgba(180, 140, 120, 0.16);
            text-align: center;
        }

        .main-heading {
            font-size: 1.25rem;
            font-weight: bold;
            color: #4a3c31;
            margin-bottom: 28px;
            word-break: keep-all;
            background: linear-gradient(transparent 60%, #fff2b2 40%);
            display: inline-block;
            padding: 0 6px;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
            text-align: left;
            padding: 0 10px;
        }

        .info-row {
            font-size: 1.05rem;
            color: #594a42;
            padding-bottom: 10px;
            border-bottom: 1px dashed #eedad1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-label {
            font-weight: bold;
            color: #d17b68;
            min-width: 52px;
        }

        .map-link {
            color: #4a3c31;
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: #f3a683;
            transition: color 0.2s;
        }
        .map-link:active {
            color: #e57c73;
        }

        .phone-link {
            color: #594a42;
            text-decoration: none;
        }

        .footer-text {
            font-size: 0.85rem;
            color: #9c887b;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- 파스텔 그라데이션 여백 효과 -->
    <div class="pastel-blob blob-1"></div>
    <div class="pastel-blob blob-2"></div>

    <!-- 여백을 꾸미는 4개의 사진 폴라로이드 -->
    <div class="deco-photo photo-tl"><img src="photo1.jpg" alt="추억 사진 1"></div>
    <div class="deco-photo photo-tr"><img src="photo2.jpg" alt="추억 사진 2"></div>
    <div class="deco-photo photo-bl"><img src="photo3.jpg" alt="추억 사진 3"></div>
    <div class="deco-photo photo-br"><img src="photo4.jpg" alt="추억 사진 4"></div>

    <!-- 1페이지: HAPPY BIRTHDAY JISOO 버튼 -->
    <div id="page1" class="page">
        <button class="hbd-button" onclick="openInvitation()">
            <div class="hbd-top">HAPPY</div>
            <div class="hbd-mid">Birthday</div>
            <div class="hbd-bottom-wrap">
                <div class="whisker left"><span></span><span></span><span></span></div>
                <div class="hbd-name">JISOO</div>
                <div class="whisker right"><span></span><span></span><span></span></div>
            </div>
            <div class="double-line"></div>
            <div class="tap-hint">터치해서 초대장 열기 💌</div>
        </button>
    </div>

    <!-- 2페이지: 초대장 상세 내용 -->
    <div id="page2" class="page hidden">
        <div class="invitation-card">
            <div class="main-heading">💛지수의 23번째 생일을 축하해💛</div>
            
            <div class="info-list">
                <div class="info-row">
                    <span class="info-label">시간 :</span>
                    <span>18:00</span>
                </div>
                <div class="info-row">
                    <span class="info-label">장소 :</span>
                    <a href="https://map.naver.com/p/search/%EB%8F%84%EC%9A%B0%EB%A3%B8%20%EC%84%9C%EB%9E%98%EB%A7%88%EC%9D%84" target="_blank" class="map-link">도우룸 서래마을 📍</a>
                </div>
                <div class="info-row">
                    <span class="info-label">연락처 :</span>
                    <a href="tel:010-2722-5260" class="phone-link">010-2722-5260</a>
                </div>
            </div>

            <div class="footer-text">이따 만나요!</div>
        </div>
    </div>
</div>

<script>
    function openInvitation() {
        document.getElementById('page1').classList.add('hidden');
        document.getElementById('page2').classList.remove('hidden');
    }
</script>

</body>
</html>
